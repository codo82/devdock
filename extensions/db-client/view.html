<!-- Vault: creazione o sblocco della master password -->
<div class="db-gate" data-role="gate" hidden>
  <form class="db-gate-box" data-role="gate-form" autocomplete="off">
    <div class="db-gate-icon">🔐</div>
    <h3 data-role="gate-title"></h3>
    <p class="db-gate-text" data-role="gate-text"></p>
    <input class="form-input" type="password" data-role="gate-password" autocomplete="off">
    <input class="form-input" type="password" data-role="gate-confirm" placeholder="Ripeti la master password" autocomplete="off" hidden>
    <div class="db-gate-error" data-role="gate-error"></div>
    <button class="btn btn-primary" type="submit" data-role="gate-submit"></button>
    <button class="btn btn-ghost btn-sm db-gate-forgot" type="button" data-action="vault-reset" data-role="gate-forgot" hidden>Ho dimenticato la master password</button>
  </form>
</div>

<!-- Contenuto disponibile a vault sbloccato -->
<div class="db-main" data-role="main" hidden>
  <div class="empty-state" data-role="no-connection"><div class="icon">🗄️</div><p>Seleziona una connessione dalla sidebar</p></div>
  <div class="db-workspace" data-role="workspace" hidden>
    <div class="db-conn-header" data-role="conn-header"></div>
    <div class="db-toolbar">
      <span class="db-active" data-role="active-db" title="Database attivo: sceglilo dalla sidebar"></span>
      <select class="form-input db-select db-limit" data-role="limit" title="Righe massime">
        <option value="100">100 righe</option>
        <option value="1000" selected>1000 righe</option>
        <option value="10000">10000 righe</option>
      </select>
      <button class="btn btn-primary btn-sm" data-action="run" title="Esegui (Ctrl/Cmd+Invio): la selezione o tutto il testo">▶ Esegui</button>
      <button class="btn btn-ghost btn-sm" data-action="export-query" title="Esporta il risultato della SELECT (CSV, JSON, SQL)">⤓ Esporta</button>
      <button class="btn btn-ghost btn-sm" data-action="new-table" title="Crea una tabella nel database attivo">＋ Tabella</button>
      <span class="db-hint">Ctrl/Cmd+Invio · le modifiche a dati e schema chiedono sempre conferma</span>
    </div>
    <div class="db-editor" data-role="editor">
      <pre class="db-editor-highlight" aria-hidden="true"><code data-role="highlight"></code></pre>
      <textarea class="db-editor-input" data-role="sql" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="SELECT * FROM …"></textarea>
    </div>
    <div class="db-results" data-role="results"></div>
  </div>
</div>
