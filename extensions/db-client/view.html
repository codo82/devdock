<!-- Vault: creazione o sblocco della master password -->
<div class="db-gate" data-role="gate" hidden>
  <form class="db-gate-box" data-role="gate-form" autocomplete="off">
    <div class="db-gate-icon">🔐</div>
    <h3 data-role="gate-title"></h3>
    <p class="db-gate-text" data-role="gate-text"></p>
    <input class="form-input" type="password" data-role="gate-password" autocomplete="off">
    <input class="form-input" type="password" data-role="gate-confirm" data-i18n-placeholder="gate.confirmPlaceholder" autocomplete="off" hidden>
    <div class="db-gate-error" data-role="gate-error"></div>
    <button class="btn btn-primary" type="submit" data-role="gate-submit"></button>
    <button class="btn btn-ghost btn-sm db-gate-forgot" type="button" data-action="vault-reset" data-role="gate-forgot" data-i18n="gate.forgot" hidden></button>
  </form>
</div>

<!-- Contenuto disponibile a vault sbloccato -->
<div class="db-main" data-role="main" hidden>
  <div class="empty-state" data-role="no-connection"><div class="icon">🗄️</div><p data-i18n="main.noConnection"></p></div>
  <div class="db-workspace" data-role="workspace" hidden>
    <div class="db-conn-header" data-role="conn-header"></div>
    <div class="db-toolbar">
      <span class="db-active" data-role="active-db" data-i18n-title="toolbar.activeDbTitle"></span>
      <select class="form-input db-select db-limit" data-role="limit" data-i18n-title="toolbar.limitTitle">
        <option value="100"></option>
        <option value="1000" selected></option>
        <option value="10000"></option>
      </select>
      <button class="btn btn-primary btn-sm" data-action="run" data-i18n="toolbar.run" data-i18n-title="toolbar.runTitle"></button>
      <button class="btn btn-ghost btn-sm" data-action="export-query" data-i18n="toolbar.export" data-i18n-title="toolbar.exportTitle"></button>
      <button class="btn btn-ghost btn-sm" data-action="new-table" data-i18n="toolbar.newTable" data-i18n-title="toolbar.newTableTitle"></button>
      <button class="btn btn-ghost btn-sm" data-action="history" data-i18n="toolbar.history" data-i18n-title="toolbar.historyTitle"></button>
      <span class="db-hint" data-i18n="toolbar.hint"></span>
    </div>
    <div class="db-editor" data-role="editor">
      <pre class="db-editor-highlight" aria-hidden="true"><code data-role="highlight"></code></pre>
      <textarea class="db-editor-input" data-role="sql" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="SELECT * FROM …"></textarea>
    </div>
    <div class="db-results" data-role="results"></div>
  </div>
</div>
