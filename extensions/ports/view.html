<div class="ports-area">
  <div class="ports-toolbar">
    <input class="form-input ports-search" data-role="search" data-i18n-placeholder="search">
    <label class="ports-check"><input type="checkbox" data-role="mine" checked> <span data-i18n="onlyMine"></span></label>
    <span class="ports-count" data-role="count"></span>
    <button class="btn btn-ghost btn-sm" data-action="refresh" data-i18n="refresh"></button>
  </div>
  <div class="ports-content" data-role="content"><div class="ports-muted" data-i18n="loading"></div></div>
</div>
