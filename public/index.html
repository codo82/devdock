<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelbo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Ccircle cx='8' cy='16' r='3' fill='%233fb950'/%3E%3Ccircle cx='24' cy='16' r='3' fill='%23388bfd'/%3E%3Cpath d='M11 16h4M17 16h4' stroke='%237d8590' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M15 13l2 3-2 3' stroke='%23388bfd' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="core/shell.css">
</head>
<body>

<!-- ================================================================
     HEADER
================================================================ -->
<header>
  <div class="header-top">
    <div class="logo">Kel<span>bo</span></div>
    <!-- pill delle estensioni (ctx.setPills) -->
    <div class="header-pills" id="activePills"></div>
    <div class="header-actions">
      <button class="btn btn-ghost lang-btn" id="langBtn" onclick="Shell.chooseLanguage(event)" data-i18n-title="core.language.choose" hidden>🌐 <span class="lang-code"></span></button>
      <button class="notif-btn" id="notifBtn" onclick="Shell.toggleNotifications()" data-i18n-title="core.notifications.enable">🔔</button>
      <button class="btn btn-ghost" onclick="Shell.exportConfig()" data-i18n-title="core.export.buttonTitle">↓ <span data-i18n="core.export.button"></span></button>
      <label class="btn btn-ghost" style="cursor:pointer" data-i18n-title="core.import.buttonTitle">↑ <span data-i18n="core.import.button"></span><input type="file" accept=".json" style="display:none" onchange="Shell.importConfig(this)"></label>
      <button class="btn btn-ghost ext-admin-btn" id="extAdminBtn" onclick="Extensions.open()" data-i18n-title="core.ext.buttonTitle">🧩<span class="section-tab-badge" id="extAdminBadge" style="display:none"></span></button>
      <button class="btn btn-ghost" onclick="Shell.openMcp()" data-i18n-title="core.mcp.buttonTitle">🤖</button>
      <button class="btn btn-ghost" onclick="Shell.refresh()" data-i18n-title="core.action.refresh">↻</button>
    </div>
  </div>
  <!-- Section navigation -->
  <nav class="section-nav">
  </nav>
</header>

<!-- ================================================================
     APP BODY
================================================================ -->
<div class="app">
  <!-- SIDEBAR — contenuto cambia in base alla sezione -->
  <nav class="sidebar" id="sidebar"><div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="core.sidebar.resize" data-i18n-aria-label="core.sidebar.resize"></div></nav>

  <!-- MAIN CONTENT: un pannello per sezione, mostrato/nascosto -->
  <main class="main" style="position:relative">
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="btn-icon" onclick="UI.closeModal()" data-i18n-aria-label="core.action.close">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="core/i18n.js"></script>
<script src="core/ui.js"></script>
<script src="core/projects.js"></script>
<script src="core/vault.js"></script>
<script src="core/extensions.js"></script>
<script src="core/shell.js"></script>
</body>
</html>
