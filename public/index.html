<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevDock</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Ccircle cx='8' cy='16' r='3' fill='%233fb950'/%3E%3Ccircle cx='24' cy='16' r='3' fill='%23388bfd'/%3E%3Cpath d='M11 16h4M17 16h4' stroke='%237d8590' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M15 13l2 3-2 3' stroke='%23388bfd' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="core/shell.css">
</head>
<body>

<!-- ================================================================
     HEADER
================================================================ -->
<header>
  <div class="header-top">
    <div class="logo">Dev<span>Dock</span></div>
    <!-- pill delle estensioni (ctx.setPills) -->
    <div class="header-pills" id="activePills"></div>
    <div class="header-actions">
      <button class="notif-btn" id="notifBtn" onclick="Shell.toggleNotifications()" title="Attiva notifiche desktop">🔔</button>
      <button class="btn btn-ghost" onclick="Shell.exportConfig()" title="Esporta config.json">↓ Export</button>
      <label class="btn btn-ghost" style="cursor:pointer" title="Importa config.json">↑ Import<input type="file" accept=".json" style="display:none" onchange="Shell.importConfig(this)"></label>
      <button class="btn btn-ghost" onclick="Shell.refresh()" title="Aggiorna">↻</button>
    </div>
  </div>
  <!-- Section navigation -->
  <nav class="section-nav">
    <button class="section-tab" id="navGit" data-section="git" data-order="30" onclick="App.goSection('git')">
      <span class="section-tab-icon">🌿</span>
      <span>Git</span>
      <span class="section-tab-badge" id="badgeGit">0</span>
    </button>
  </nav>
</header>

<!-- ================================================================
     APP BODY
================================================================ -->
<div class="app">
  <!-- SIDEBAR — contenuto cambia in base alla sezione -->
  <nav class="sidebar" id="sidebar">
    <div id="sidebarContent"></div>
  </nav>

  <!-- MAIN CONTENT: un pannello per sezione, mostrato/nascosto -->
  <main class="main" style="position:relative">
    <div id="mainArea-git" class="main-panel" style="display:none">
      <div id="mainContent-git" style="flex:1;overflow:hidden;min-height:0;position:relative;display:flex;flex-direction:column"></div>
      <div class="sse-panel" id="ssePanel-git">
        <div class="sse-panel-header">
          <span id="ssePanelTitle-git">Output</span>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn btn-ghost btn-sm" onclick="App.clearSseOutput()" title="Pulisci">🗑</button>
            <button class="btn btn-ghost btn-sm" onclick="App.closeSsePanel()">✕</button>
          </div>
        </div>
        <div class="sse-body" id="sseBody-git"></div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Titolo</h3>
      <button class="btn-icon" onclick="UI.closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="core/ui.js"></script>
<script src="core/shell.js"></script>
<script src="core/app.js"></script>
</body>
</html>
