<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevDock</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Ccircle cx='8' cy='16' r='3' fill='%233fb950'/%3E%3Ccircle cx='24' cy='16' r='3' fill='%23388bfd'/%3E%3Cpath d='M11 16h4M17 16h4' stroke='%237d8590' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M15 13l2 3-2 3' stroke='%23388bfd' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="core/shell.css">
</head>
<body>

<!-- ================================================================
     HEADER
================================================================ -->
<header>
  <div class="header-top">
    <div class="logo">Dev<span>Dock</span></div>
    <div class="header-pills" id="activePills"></div>
    <div class="header-actions">
      <button class="notif-btn" id="notifBtn" onclick="App.toggleNotifications()" title="Notifiche desktop">🔔</button>
      <button class="btn btn-ghost" onclick="App.exportConfig()" title="Esporta config.json">↓ Export</button>
      <label class="btn btn-ghost" style="cursor:pointer" title="Importa config.json">↑ Import<input type="file" accept=".json" style="display:none" onchange="App.importConfig(this)"></label>
      <button class="btn btn-ghost" onclick="App.refresh()">↻</button>
      <button class="btn btn-ghost" onclick="App.goSection('pm2')" title="PM2" style="padding:5px 8px;font-size:12px">⚙️</button>
      <button class="btn btn-danger" onclick="App.stopAll()" id="stopAllBtn" style="display:none">⏹ Stop all</button>
    </div>
  </div>
  <!-- Section navigation -->
  <nav class="section-nav">
    <button class="section-tab" id="navTunnel" onclick="App.goSection('tunnel')">
      <span class="section-tab-icon">🔗</span>
      <span>Tunnels SSH</span>
      <span class="section-tab-badge" id="badgeTunnel">0</span>
    </button>
    <button class="section-tab" id="navNpm" onclick="App.goSection('npm')">
      <span class="section-tab-icon">📦</span>
      <span>NPM</span>
      <span class="section-tab-badge" id="badgeNpm">0</span>
    </button>
    <button class="section-tab" id="navGit" onclick="App.goSection('git')">
      <span class="section-tab-icon">🌿</span>
      <span>Git</span>
      <span class="section-tab-badge" id="badgeGit">0</span>
    </button>
    <button class="section-tab" id="navSwagger" onclick="App.goSection('swagger')">
      <span class="section-tab-icon">📄</span>
      <span>Swagger</span>
    </button>
  </nav>
</header>

<!-- ================================================================
     APP BODY
================================================================ -->
<div class="app">
  <!-- SIDEBAR — contenuto cambia in base alla sezione -->
  <nav class="sidebar" id="sidebar" data-section="tunnel">
    <div id="sidebarContent"></div>
  </nav>

  <!-- MAIN CONTENT: un pannello per sezione, mostrato/nascosto -->
  <main class="main" style="position:relative">
    <div id="mainArea-tunnel" class="main-panel" style="display:flex">
      <div class="empty-state"><div class="icon">🔗</div><p>Seleziona un gruppo dalla sidebar</p></div>
    </div>
    <div id="mainArea-npm" class="main-panel" style="display:none">
      <div id="mainContent-npm" style="flex:1;overflow:auto;min-height:0"></div>
      <div class="sse-panel" id="ssePanel-npm">
        <div class="sse-panel-header">
          <span id="ssePanelTitle-npm">Output</span>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn btn-ghost btn-sm" onclick="App.clearSseOutput()" title="Pulisci">🗑</button>
            <button class="btn btn-ghost btn-sm" onclick="App.closeSsePanel()">✕</button>
          </div>
        </div>
        <div class="sse-body" id="sseBody-npm"></div>
      </div>
    </div>
    <div id="mainArea-pm2" class="main-panel" style="display:none">
      <div id="mainContent-pm2" style="flex:1;overflow:auto;min-height:0"></div>
      <div class="sse-panel" id="ssePanel-pm2">
        <div class="sse-panel-header">
          <span id="ssePanelTitle-pm2">Output</span>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn btn-ghost btn-sm" onclick="App.clearSseOutput()" title="Pulisci">🗑</button>
            <button class="btn btn-ghost btn-sm" onclick="App.closeSsePanel()">✕</button>
          </div>
        </div>
        <div class="sse-body" id="sseBody-pm2"></div>
      </div>
    </div>
    <div id="mainArea-git" class="main-panel" style="display:none">
      <div id="mainContent-git" style="flex:1;overflow:hidden;min-height:0;position:relative;display:flex;flex-direction:column"></div>
      <div class="sse-panel" id="ssePanel-git">
        <div class="sse-panel-header">
          <span id="ssePanelTitle-git">Output</span>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn btn-ghost btn-sm" onclick="App.clearSseOutput()" title="Pulisci">🗑</button>
            <button class="btn btn-ghost btn-sm" onclick="App.closeSsePanel()">✕</button>
          </div>
        </div>
        <div class="sse-body" id="sseBody-git"></div>
      </div>
    </div>
    <div id="mainArea-swagger" class="main-panel" style="display:none;flex-direction:column"></div>
    <div id="mainArea-settings" class="main-panel" style="display:none"></div>
  </main>
</div>

<!-- LOG DRAWER -->
<div class="log-drawer" id="logDrawer">
  <div class="log-drawer-header">
    <span>🔗 SSH Log — <span id="logDrawerTitle" style="color:var(--c-tunnel)">—</span></span>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('logBody').innerHTML=''" title="Pulisci">🗑</button>
      <button class="btn btn-ghost btn-sm" onclick="App.closeLogs()">✕</button>
    </div>
  </div>
  <div class="log-body" id="logBody"></div>
</div>

<!-- SSE OUTPUT PANELs: one per section, inside each main-panel via JS -->

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Titolo</h3>
      <button class="btn-icon" onclick="App.closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="core/ui.js"></script>
<script src="core/app.js"></script>
</body>
</html>
